  <text class="t1" x="859.0" y="291.0">BackupCard</text>
  <text class="sig" x="859.0" y="307.0">onSave, onRestore</text>
  <rect class="box priv" x="773" y="326" width="172" height="40"/>
  <text class="t1" x="859.0" y="343.0">ManageSymptomsCard</text>
  <text class="sig" x="859.0" y="359.0">active, archived</text>
  <rect class="box priv" x="797" y="378" width="148" height="40"/>
  <text class="t1" x="871.0" y="395.0">SymptomRow</text>
  <text class="sig" x="871.0" y="411.0">symptom, onRename</text>
  <rect class="box priv" x="773" y="430" width="172" height="40"/>
  <text class="t1" x="859.0" y="447.0">LockNowCard</text>
  <text class="sig" x="859.0" y="463.0">session.lock()</text>
  <path class="note" d="M45,400 H288 L300,412 V470 H45 Z"/>
  <path class="note" d="M288,400 V412 H300"/>
  <text class="code" x="55" y="419">Forgot password has no reset:</text>
  <text class="code" x="55" y="433">erase() deletes the diary on</text>
  <text class="code" x="55" y="447">this phone and returns to the</text>
  <text class="code" x="55" y="461">first-run form.</text>

  <path class="note" d="M365,605 H673 L685,617 V661 H365 Z"/>
  <path class="note" d="M673,605 V617 H685"/>
  <text class="code" x="375" y="624">SummaryPaper stays white and has print</text>
  <text class="code" x="375" y="638">styles that hide the tab bar, as the</text>
  <text class="code" x="375" y="652">prototype sheet does.</text>

  <path class="note" d="M745,500 H1093 L1105,512 V570 H745 Z"/>
  <path class="note" d="M1093,500 V512 H1105"/>
  <text class="code" x="755" y="519">ManageSymptomsCard renames and archives; the</text>
  <text class="code" x="755" y="533">symptom type is not editable.</text>
  <text class="code" x="755" y="547">BackupCard checks the file with domain/backup</text>
  <text class="code" x="755" y="561">before it replaces any data.</text>

  <rect x="45" y="520" width="215" height="118" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="57" y="540" font-size="13" font-weight="bold" fill="#111">Legend</text>
  <rect class="box pub" x="57" y="552" width="18" height="13"/>
  <text class="lbl" x="83" y="563">Route screen</text>
  <rect class="box priv" x="57" y="574" width="18" height="13"/>
  <text class="lbl" x="83" y="585">Component</text>
  <rect class="type" x="57" y="596" width="18" height="13" rx="4"/>
  <text class="lbl" x="83" y="607">Hook</text>
  <path class="edge" d="M57,625 H77" marker-end="url(#arrow)"/>
  <text class="lbl" x="83" y="629">Renders or calls</text>
