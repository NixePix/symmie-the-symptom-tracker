  <rect class="box priv" x="393" y="222" width="172" height="40"/>
  <text class="t1" x="479.0" y="239.0">SummaryPaper</text>
  <text class="sig" x="479.0" y="255.0">range, diary</text>
  <rect class="box priv" x="417" y="274" width="148" height="40"/>
  <text class="t1" x="491.0" y="291.0">MiniGraph</text>
  <text class="sig" x="491.0" y="307.0">series</text>
  <rect class="box priv" x="417" y="326" width="148" height="40"/>
