  <rect class="box priv" x="417" y="378" width="148" height="40"/>
  <text class="t1" x="491.0" y="395.0">NotesList</text>
  <text class="sig" x="491.0" y="411.0">notes</text>
  <rect class="box priv" x="417" y="430" width="148" height="40"/>
  <text class="t1" x="491.0" y="447.0">Disclaimer</text>
  <text class="sig" x="491.0" y="463.0">ui/, fixed text</text>
  <rect class="box priv" x="393" y="482" width="172" height="40"/>
  <text class="t1" x="479.0" y="499.0">PrintButton</text>
  <text class="sig" x="479.0" y="515.0">window.print()</text>
  <rect class="type" x="393" y="534" width="172" height="40" rx="12"/>
  <text class="t1" x="479.0" y="551.0">useSummary</text>
  <text class="sig" x="479.0" y="567.0">from, to</text>
  <rect class="box pub" x="745" y="85" width="200" height="46"/>
  <text class="t1" x="845.0" y="105.0">SettingsScreen</text>
  <text class="sig" x="845.0" y="121.0">/settings</text>
  <rect class="box priv" x="773" y="170" width="172" height="40"/>
  <text class="t1" x="859.0" y="187.0">InstallCard</text>
  <text class="sig" x="859.0" y="203.0">useInstallPrompt()</text>
  <rect class="box priv" x="773" y="222" width="172" height="40"/>
