  <text class="rlbl" x="35" y="67">src/features/lock</text>
  <rect class="region" x="345" y="50" width="360" height="630"/>
  <text class="rlbl" x="355" y="67">src/features/summary</text>
  <rect class="region" x="725" y="50" width="400" height="630"/>
  <text class="rlbl" x="735" y="67">src/features/settings</text>
