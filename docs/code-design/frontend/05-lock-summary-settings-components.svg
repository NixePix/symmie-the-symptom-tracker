  <path class="edge" d="M379,554 H393" marker-end="url(#arrow)"/>
  <path class="edge" d="M759,131 V450"/>
  <path class="edge" d="M759,190 H773" marker-end="url(#arrow)"/>
  <path class="edge" d="M759,242 H773" marker-end="url(#arrow)"/>
  <path class="edge" d="M759,294 H773" marker-end="url(#arrow)"/>
  <path class="edge" d="M759,346 H773" marker-end="url(#arrow)"/>
  <path class="edge" d="M783,366 V398 H797" marker-end="url(#arrow)"/>
  <path class="edge" d="M759,450 H773" marker-end="url(#arrow)"/>
  <rect class="box pub" x="45" y="85" width="200" height="46"/>
  <text class="t1" x="145.0" y="105.0">LockScreen</text>
  <text class="sig" x="145.0" y="121.0">first run | locked</text>
  <rect class="box priv" x="73" y="170" width="172" height="40"/>
  <text class="t1" x="159.0" y="187.0">SetupForm</text>
