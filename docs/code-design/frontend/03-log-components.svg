  <text class="sig" x="1079.0" y="489.0">draft, onChange</text>
  <rect class="box priv" x="1195" y="230" width="200" height="46"/>
  <text class="t1" x="1295.0" y="250.0">Sheet</text>
  <text class="sig" x="1295.0" y="266.0">ui/, one open at a time</text>
  <rect class="box priv" x="1223" y="300" width="172" height="40"/>
  <text class="t1" x="1309.0" y="317.0">AddSymptomForm</text>
  <text class="sig" x="1309.0" y="333.0">onSave(name, type)</text>
  <rect class="box priv" x="1223" y="352" width="172" height="40"/>
  <text class="t1" x="1309.0" y="369.0">SymptomMenuForm</text>
  <text class="sig" x="1309.0" y="385.0">rename, archive, clear</text>
  <rect class="box priv" x="1223" y="404" width="172" height="40"/>
  <text class="t1" x="1309.0" y="421.0">PickDateForm</text>
  <text class="sig" x="1309.0" y="437.0">onGo(date)</text>
  <rect class="box pub" x="600" y="85" width="200" height="46"/>
  <text class="t1" x="700.0" y="105.0">LogScreen</text>
  <text class="sig" x="700.0" y="121.0">date from route param</text>
  <rect class="type" x="330" y="85" width="190" height="46" rx="12"/>
  <text class="t1" x="425.0" y="105.0">useLogFlow</text>
  <text class="sig" x="425.0" y="121.0">step, next, back, goTo</text>
  <rect class="type" x="890" y="85" width="190" height="46" rx="12"/>
  <text class="t1" x="985.0" y="105.0">useDayLog</text>
  <text class="sig" x="985.0" y="121.0">values, setValue, …</text>
  <rect class="type" x="1130" y="85" width="200" height="46" rx="12"/>
  <text class="t1" x="1230.0" y="105.0">useDiary</text>
  <text class="sig" x="1230.0" y="121.0">state/DiaryProvider</text>
  <path class="note" d="M45,600 H673 L685,612 V684 H45 Z"/>
  <path class="note" d="M673,600 V612 H685"/>
  <text class="code" x="55" y="619">LogScreen owns:</text>
  <text class="code" x="55" y="633">  step index   useLogFlow, local; resets when the date changes</text>
  <text class="code" x="55" y="647">  open sheet   useState&lt;null | &quot;add&quot; | &quot;pick&quot; | { menu: SymptomId }&gt;</text>
  <text class="code" x="55" y="661">  values       useDayLog(date), a view over DiaryProvider</text>
  <text class="code" x="55" y="675">DayNoteField keeps a draft and calls setNote 400 ms after typing stops.</text>

  <rect x="1240" y="520" width="220" height="162" fill="#ffffff" stroke="#222" stroke-width="1"/>
