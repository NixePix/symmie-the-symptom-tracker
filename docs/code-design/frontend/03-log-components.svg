  <text class="t1" x="849.0" y="421.0">SameAsYesterday</text>
  <text class="sig" x="849.0" y="437.0">yesterday, onConfirm</text>
  <rect class="box priv" x="763" y="456" width="172" height="40"/>
  <text class="t1" x="849.0" y="473.0">ConfirmAllPill</text>
  <text class="sig" x="849.0" y="489.0">count, onConfirm</text>
  <rect class="box priv" x="763" y="508" width="172" height="40"/>
  <text class="t1" x="849.0" y="525.0">StepNav</text>
  <text class="sig" x="849.0" y="541.0">back, skip or next</text>
  <rect class="box priv" x="965" y="230" width="200" height="46"/>
  <text class="t1" x="1065.0" y="250.0">DayRecap</text>
  <text class="sig" x="1065.0" y="266.0">tiles and the note</text>
  <rect class="box priv" x="993" y="300" width="172" height="40"/>
  <text class="t1" x="1079.0" y="317.0">SymptomTileGrid</text>
