  <rect class="box priv" x="45" y="230" width="200" height="46"/>
  <text class="t1" x="145.0" y="250.0">DayHeader</text>
  <text class="sig" x="145.0" y="266.0">title, pick-date button</text>
  <rect class="box priv" x="275" y="230" width="200" height="46"/>
  <text class="t1" x="375.0" y="250.0">DayStrip</text>
  <text class="sig" x="375.0" y="266.0">last 21 days</text>
