  <text class="code" x="55" y="439">Each tab owns its own</text>
  <text class="code" x="55" y="453">selection state, so a</text>
  <text class="code" x="55" y="467">tab switch resets it,</text>
  <text class="code" x="55" y="481">as in the prototype.</text>
  <text class="code" x="55" y="495">Charts are plain SVG</text>
  <text class="code" x="55" y="509">components that take</text>
  <text class="code" x="55" y="523">ready-made geometry:</text>
  <text class="code" x="55" y="537">no chart library.</text>

