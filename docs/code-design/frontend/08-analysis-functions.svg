  <text class="t1" x="165.0" y="227.0">evolutionSeries</text>
  <text class="sig" x="165.0" y="243.0">(diary, mode, ids, today) -&gt; Series[]</text>
  <rect class="box priv" x="330" y="205" width="250" height="50"/>
  <text class="t1" x="455.0" y="227.0">yearScores</text>
  <text class="sig" x="455.0" y="243.0">(diary, id, today) -&gt; DayScore[]</text>
