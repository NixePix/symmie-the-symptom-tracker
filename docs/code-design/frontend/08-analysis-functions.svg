  <path class="edge" d="M54,322.0 H68" marker-end="url(#arrow)"/>
  <path class="edge" d="M54,378.0 H68" marker-end="url(#arrow)"/>
  <text class="lbl" x="314" y="326">1. calls</text>
  <text class="lbl" x="314" y="382">2. calls, per symptom and bucket</text>
  <path class="edge" d="M1214,255 V322.0"/>
  <path class="edge" d="M1214,322.0 H1228" marker-end="url(#arrow)"/>
  <text class="lbl" x="1195" y="326" text-anchor="end">1. calls, per pair</text>
  <path class="edge" d="M455.0,255 V520" marker-end="url(#arrow)"/>
  <text class="lbl" x="463.0" y="400">1. calls</text>
