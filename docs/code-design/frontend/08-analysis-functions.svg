  <text class="t1" x="165.0" y="100.0">useEvolutionSeries</text>
  <text class="sig" x="165.0" y="116.0">(mode, selected)</text>
  <rect class="box pub" x="330" y="80" width="250" height="46"/>
  <text class="t1" x="455.0" y="100.0">useYearScores</text>
  <text class="sig" x="455.0" y="116.0">(symptomId | null)</text>
  <rect class="box pub" x="910" y="80" width="250" height="46"/>
  <text class="t1" x="1035.0" y="100.0">usePatterns</text>
  <text class="sig" x="1035.0" y="116.0">(symptomId)</text>
