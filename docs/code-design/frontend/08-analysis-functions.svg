  <text class="t1" x="745.0" y="227.0">weekdayAverages</text>
  <text class="sig" x="745.0" y="243.0">(diary, id) -&gt; (number | null)[7]</text>
  <rect class="box priv" x="910" y="205" width="250" height="50"/>
  <text class="t1" x="1035.0" y="227.0">monthAverages</text>
  <text class="sig" x="1035.0" y="243.0">(diary, id) -&gt; (number | null)[12]</text>
  <rect class="box priv" x="1200" y="205" width="250" height="50"/>
  <text class="t1" x="1325.0" y="227.0">rankPairs</text>
  <text class="sig" x="1325.0" y="243.0">(diary, symptoms) -&gt; Pair[]</text>
  <rect class="box priv" x="68" y="300" width="240" height="44"/>
  <text class="t1" x="188.0" y="319.0">buildBuckets</text>
  <text class="sig" x="188.0" y="335.0">(mode, today) -&gt; Bucket[]</text>
  <rect class="box priv" x="68" y="356" width="240" height="44"/>
  <text class="t1" x="188.0" y="375.0">bucketValue</text>
  <text class="sig" x="188.0" y="391.0">(sym, bucket, diary) -&gt; number|null</text>
  <rect class="box priv" x="1228" y="300" width="240" height="44"/>
  <text class="t1" x="1348.0" y="319.0">pearson</text>
  <text class="sig" x="1348.0" y="335.0">(diary, a, b) -&gt; { r, n }</text>
  <rect class="box priv" x="330" y="520" width="250" height="50"/>
  <text class="t1" x="455.0" y="542.0">normalise</text>
  <text class="sig" x="455.0" y="558.0">(symptom, value) -&gt; 0..1</text>
  <path class="note" d="M40,625 H788 L800,637 V681 H40 Z"/>
  <path class="note" d="M788,625 V637 H800"/>
  <text class="code" x="50" y="644">Not drawn: calls to average() in stats.ts and to addDays(), parse() in dates.ts.</text>
  <text class="code" x="50" y="658">Every function here is pure: it takes the Diary and today as arguments and reads no clock, no storage.</text>
  <text class="code" x="50" y="672">topSymptoms(diary, 5) feeds the chips of all three tabs through a fourth hook, useTopSymptoms.</text>

  <rect x="1245" y="490" width="215" height="118" fill="#ffffff" stroke="#222" stroke-width="1"/>
