<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" font-family="Helvetica, Arial, sans-serif">
  <!-- Class-structure template: which types exist, what members they have, and how they relate
       (subclassing, references held in attributes, construction). Copy it, rename the classes,
       delete what the view does not use, and remove from the legend every entry it no longer
       contains. The sample content is the image proxy from the Proxy pattern. -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#eef4f8"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9db8c9" stroke-width="1.5"/>
    </pattern>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
    <!-- Hollow triangle: the end at the base class. -->
    <marker id="super" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
    .focus { fill: #e8652b; stroke: #222; stroke-width: 1.5; }
    .ext { fill: url(#hatch); stroke: #222; stroke-width: 1.5; }
    .sep { stroke: #222; stroke-width: 1; }
    .note { fill: #ffffff; stroke: #222; stroke-width: 1.2; }
    .region { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .rlbl { font-size: 12px; fill: #555; font-style: italic; }
    .cname { font-size: 13px; fill: #111; text-anchor: middle; }
    .abs { font-style: italic; }
    .stereo { font-size: 10px; fill: #555; text-anchor: middle; }
    .t2 { font-size: 11px; fill: #333; text-anchor: middle; }
    .mem { font-size: 11px; fill: #222; font-family: Menlo, Consolas, "Courier New", monospace; }
    .code { font-size: 11px; fill: #222; font-family: Menlo, Consolas, "Courier New", monospace; white-space: pre; }
    .lbl { font-size: 11px; fill: #333; }
    .edge { fill: none; stroke: #222; stroke-width: 1.3; }
    .dash { fill: none; stroke: #222; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .anchor { fill: none; stroke: #555; stroke-width: 1.1; stroke-dasharray: 3 3; }
    .title { font-size: 15px; fill: #111; }
  </style>
  <rect width="1180" height="540" fill="#ffffff"/>

  <text class="title" x="20" y="28">Graphics — Class structure (the lazy-loading image proxy)</text>

  <!-- Module region first, so every class and line is drawn over its border. -->
  <rect class="region" x="25" y="232" width="520" height="210"/>
  <text class="rlbl" x="35" y="249">graphics/image.py</text>

  <!-- Edges before boxes. -->
  <path class="edge" d="M220,75 H338" marker-end="url(#open)"/>
  <text class="lbl" x="246" y="67">graphics [*]</text>

  <!-- One subclass bus: each child joins it, one line carries the triangle to the base class. -->
  <path class="edge" d="M190,255 V215 H430"/>
  <path class="edge" d="M430,255 V174" marker-end="url(#super)"/>
  <path class="dash" d="M430,215 H570"/>
  <text class="lbl" x="576" y="219">more subclasses, not drawn</text>

  <path class="dash" d="M338,270 H222" marker-end="url(#open)"/>
  <text class="lbl" x="258" y="263">creates</text>
  <path class="edge" d="M338,320 H222" marker-end="url(#open)"/>
  <text class="lbl" x="258" y="313">_image</text>

  <path class="edge" d="M130,405 V468" marker-end="url(#open)"/>
  <text class="lbl" x="137" y="460">_imp</text>

  <!-- A class with its members not drawn: the header alone. -->
  <rect class="box" x="40" y="60" width="180" height="30"/>
  <text class="cname" x="130" y="80">DocumentEditor</text>

  <!-- Abstract class or Protocol: stereotype line, name and abstract methods in italic. -->
  <rect class="box" x="340" y="60" width="180" height="112"/>
  <text class="stereo" x="430" y="75">«abstract»</text>
  <text class="cname abs" x="430" y="91">Graphic</text>
  <line class="sep" x1="340" y1="98" x2="520" y2="98"/>
  <text class="mem abs" x="350" y="115">draw()</text>
  <text class="mem abs" x="350" y="131">get_extent() -&gt; Size</text>
  <text class="mem abs" x="350" y="147">store(f)</text>
  <text class="mem abs" x="350" y="163">load(f)</text>

  <!-- Concrete class: header, methods, attributes. -->
  <rect class="box" x="40" y="255" width="180" height="150"/>
  <text class="cname" x="130" y="274">Image</text>
  <line class="sep" x1="40" y1="283" x2="220" y2="283"/>
  <text class="mem" x="50" y="300">draw()</text>
  <text class="mem" x="50" y="316">get_extent() -&gt; Size</text>
  <text class="mem" x="50" y="332">store(f)</text>
  <text class="mem" x="50" y="348">load(f)</text>
  <line class="sep" x1="40" y1="360" x2="220" y2="360"/>
  <text class="mem" x="50" y="377">_imp: PIL.Image</text>
  <text class="mem" x="50" y="393">extent: Size</text>

  <!-- The class the diagram is about: orange header. -->
  <rect class="box" x="340" y="255" width="180" height="166"/>
  <rect class="focus" x="340" y="255" width="180" height="28"/>
  <text class="cname" x="430" y="274">ImageProxy</text>
  <text class="mem" x="350" y="300">draw()</text>
  <text class="mem" x="350" y="316">get_extent() -&gt; Size</text>
  <text class="mem" x="350" y="332">store(f)</text>
  <text class="mem" x="350" y="348">load(f)</text>
  <line class="sep" x1="340" y1="360" x2="520" y2="360"/>
  <text class="mem" x="350" y="377">_path: Path</text>
  <text class="mem" x="350" y="393">_image: Image | None</text>
  <text class="mem" x="350" y="409">extent: Size</text>

  <!-- Class from a library: hatched, subtitle names the package. -->
  <rect class="ext" x="40" y="470" width="180" height="56"/>
  <text class="cname" x="130" y="494">PIL.Image.Image</text>
  <text class="t2" x="130" y="511">Pillow</text>

  <!-- Notes: a code sketch of one method, anchored by a small circle on the method's line.
       Drawn after the class so the circle sits on top of it. -->
  <path class="anchor" d="M513,296 H575 V275 H598"/>
  <circle cx="509" cy="296" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <path class="anchor" d="M513,312 H550 V380 H598"/>
  <circle cx="509" cy="312" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>

  <path class="note" d="M600,245 H888 L900,257 V310 H600 Z"/>
  <path class="note" d="M888,245 V257 H900"/>
  <text class="code" x="612" y="266">if self._image is None:</text>
  <text class="code" x="612" y="282">    self._image = Image(self._path)</text>
  <text class="code" x="612" y="298">self._image.draw()</text>

  <path class="note" d="M600,350 H888 L900,362 V415 H600 Z"/>
  <path class="note" d="M888,350 V362 H900"/>
  <text class="code" x="612" y="371">if self._image is None:</text>
  <text class="code" x="612" y="387">    return self.extent</text>
  <text class="code" x="612" y="403">return self._image.get_extent()</text>

  <!-- Legend: list only the types this view uses. -->
  <rect x="960" y="60" width="205" height="292" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="972" y="80" font-size="13" font-weight="bold" fill="#111">Legend</text>
  <rect class="box" x="972" y="92" width="18" height="13"/>
  <rect class="focus" x="972" y="92" width="18" height="5"/>
  <text class="lbl" x="998" y="103">Class this view is about</text>
  <rect class="box" x="972" y="114" width="18" height="13"/>
  <text class="lbl" x="998" y="125">Class</text>
  <rect class="box" x="972" y="136" width="18" height="13"/>
  <text x="975" y="146" font-size="10" font-style="italic" fill="#111">A</text>
  <text class="lbl" x="998" y="147">Abstract class / Protocol</text>
  <rect class="ext" x="972" y="158" width="18" height="13"/>
  <text class="lbl" x="998" y="169">Class from a library</text>
  <rect class="region" x="972" y="180" width="18" height="13"/>
  <text class="lbl" x="998" y="191">Module (file)</text>
  <path class="note" d="M972,202 H985 L990,207 V215 H972 Z"/>
  <text class="lbl" x="998" y="213">Note: method body sketch</text>
  <path class="edge" d="M972,235 H992" marker-end="url(#super)"/>
  <text class="lbl" x="998" y="239">Subclasses (A is a B)</text>
  <path class="edge" d="M972,259 H990" marker-end="url(#open)"/>
  <text class="lbl" x="998" y="263">Holds a B in attribute</text>
  <path class="dash" d="M972,283 H990" marker-end="url(#open)"/>
  <text class="lbl" x="998" y="287">Creates a B</text>
  <path class="anchor" d="M976,307 H992"/>
  <circle cx="975" cy="307" r="3" fill="#ffffff" stroke="#222" stroke-width="1.1"/>
  <text class="lbl" x="998" y="311">Note is about this member</text>
  <path class="dash" d="M972,331 H992"/>
  <text class="lbl" x="998" y="335">More of the same, not drawn</text>
</svg>
